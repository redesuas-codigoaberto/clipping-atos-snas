# The pipeline uses only the standard library; this file holds the development tools and their settings.
[project]
name = "clipping-atos-snas"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["playwright>=1.50", "pytest>=8", "ruff>=0.15"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["scripts", "tests"]
extend-exclude = ["data", "clipping-novo", "clipping-antigo", "site"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade and simplify.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
