name: Verificações

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --group dev ruff check --output-format=github .
      - run: uv run --group dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The minimum version in pyproject.toml, and the one the daily workflow runs.
          python-version: '3.12'
      - run: uv run --group dev pytest
        env:
          # The page tests open the site in the runner's Chrome; without it they must fail, not skip.
          REQUIRE_BROWSER: '1'
