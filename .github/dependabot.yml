version: 2
updates:
  # The workflow actions, such as the Node.js 24 updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # The development tools in uv.lock (pytest, ruff); the pipeline itself has no dependencies.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ['*']
